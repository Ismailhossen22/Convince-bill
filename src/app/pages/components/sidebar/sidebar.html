<div class="min-h-screen flex justify-center items-start sm:items-center pt-10 pb-10">
  <div class="w-full max-w-6xl mx-4">
    <div class="bg-gray-100 rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-5 border-b border-gray-200 flex justify-between items-center relative">
        <div class="w-16 sm:w-20"></div>

        <h3 class="text-xl font-semibold text-gray-800 text-center flex-1">Conveyance Bills</h3>

        <div class="w-16 sm:w-20 text-right">
          <p
            class="text-sm text-red-600 hover:text-red-800 font-medium cursor-pointer transition-colors inline-block"
            (click)="logout()"
          >
            Logout ➔
          </p>
        </div>
      </div>
      <div class="flex justify-center min-h-110">
        <ul class="p-4 space-y-2 w-full sm:w-1/2">
          @for (item of menuItems; track item.route) {
            <li
              [routerLink]="item.route"
              routerLinkActive="!bg-green-600 !text-white"
              class="flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-300 hover:bg-red-200 text-gray-700 cursor-pointer transition-all duration-200"
            >
              <span class="text-lg">{{ item.icon }}</span>
              <span class="text-sm font-medium">{{ item.label }}</span>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</div>
