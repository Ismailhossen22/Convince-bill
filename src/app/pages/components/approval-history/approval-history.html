<div class="max-w-7xl mx-auto px-4 py-6">
  <div class="px-6 py-5 flex items-center justify-center mb-4">
    <h2
      class="w-3/5 py-5 font-stretch-extra-condensed rounded-xl bg-[#cfcfc6] text-3xl/8 text-center font-semibold text-gray-700"
    >
      Approved History
    </h2>
  </div>

  <div class="w-full">
    <div class="flex items-center justify-center p-4">
      <div
        class="w-7/8 bg-white border border-gray-200 rounded-lg shadow-sm p-6 flex flex-col md:flex-row items-end md:items-center gap-6"
      >
        <div class="w-full">
          <div class="grid grid-cols-2 gap-5">
            <div class="grow  flex items-center gap-4">
              <label class="text-base font-bold text-gray-700 whitespace-nowrap">From:</label>
              <input
                type="date"
                class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:ring-1 focus:ring-gray-300 focus:border-gray-300 transition-all"
              />
            </div>

            <div class="grow ml-10 flex items-center gap-2">
              <label class="text-base font-bold text-gray-700 whitespace-nowrap">To:</label>
              <input
                type="date"
                class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:ring-1 focus:ring-gray-300 focus:border-gray-300 transition-all"
              />
            </div>

            <div class="flex items-center gap-2 w-full">
              <label class="text-base font-bold text-gray-700 whitespace-nowrap">Status:</label>
              <input
                type="text"
                class="grow px-3 py-2 border border-gray-400 rounded focus:outline-none focus:ring-1 focus:ring-gray-300 focus:border-gray-300 transition-all"
              />
            </div>

            <div class="flex items-center gap-2 w-full">
              <label class="text-base font-bold text-gray-700 whitespace-nowrap"
                >Employee Name:</label
              >
              <input
                type="text"
                class="grow px-3 py-2 border border-gray-400 rounded focus:outline-none focus:ring-1 focus:ring-gray-300 focus:border-gray-300 transition-all"
              />
            </div>
          </div>
        </div>

        <div class="w-min-50 px-2">
          <button
            class=" w-full bg-[#6db9d9] hover:bg-[#5ca8c8] text-white font-bold py-2.5 px-10 rounded-xl shadow-md transition-colors duration-200"
          >
            Apply
          </button>
        </div>
      </div>
    </div>

    <div class="w-full flex flex-col items-center mb-4">
      <!-- Bill Items Table -->
      <div class="rounded-lg border border-gray-200 mb-4 w-full">
        <div class="overflow-x-auto p-4">
          <table class="w-full border-collapse border border-gray-300 text-sm text-center">
            <thead class="bg-gray-100">
              <tr>
                <th class="border border-gray-300 px-4 py-3 font-bold text-gray-800">SL.</th>

                <th class="border border-gray-300 px-4 py-3 font-bold text-gray-800">
                  Employee ID
                </th>
                <th class="border border-gray-300 px-4 py-3 font-bold text-gray-800">
                  Employee Name
                </th>
                <th class="border border-gray-300 px-4 py-3 font-bold text-gray-800">
                  Submission Date
                </th>
                <th class="border border-gray-300 px-4 py-3 font-bold text-gray-800">Total Bill</th>
                <th class="border border-gray-300 px-4 py-3 font-bold text-gray-800">Details</th>
              </tr>
            </thead>

            <tbody class="divide-y divide-gray-300">
              <tr class="hover:bg-gray-50 transition-colors">
                <td class="border border-gray-300 px-4 py-3">1</td>

                <td class="border border-gray-300 px-4 py-3 font-bold">1160</td>
                <td class="border border-gray-300 px-4 py-3">Ruhama</td>
                <td class="border border-gray-300 px-4 py-3">1-Jan</td>
                <td class="border border-gray-300 px-4 py-3">260</td>
                <td class="px-4 py-2 border-none text-left">
                  <button
                    class="bg-[#add8e6] hover:bg-[#99c9d8] text-gray-800 text-xs font-bold py-1.5 px-4 rounded-full shadow-sm"
                  >
                    Details View
                  </button>
                </td>
              </tr>

              <tr class="hover:bg-gray-50 transition-colors">
                <td class="border border-gray-300 px-4 py-3">2</td>

                <td class="border border-gray-300 px-4 py-3 font-bold">1196</td>
                <td class="border border-gray-300 px-4 py-3">Nayan</td>
                <td class="border border-gray-300 px-4 py-3">2-Jan</td>
                <td class="border border-gray-300 px-4 py-3">190</td>
                <td class="px-4 py-2 border-none text-left">
                  <button
                    class="bg-[#add8e6] hover:bg-[#99c9d8] text-gray-800 text-xs font-bold py-1.5 px-4 rounded-full shadow-sm"
                  >
                    Details View
                  </button>
                </td>
              </tr>

              <tr class="hover:bg-gray-50 transition-colors">
                <td class="border border-gray-300 px-4 py-3">3</td>

                <td class="border border-gray-300 px-4 py-3 font-bold">1198</td>
                <td class="border border-gray-300 px-4 py-3">Shourav</td>
                <td class="border border-gray-300 px-4 py-3">3-Jan</td>
                <td class="border border-gray-300 px-4 py-3">290</td>
                <td class="px-4 py-2 border-none text-left">
                  <button
                    class="bg-[#add8e6] hover:bg-[#99c9d8] text-gray-800 text-xs font-bold py-1.5 px-4 rounded-full shadow-sm"
                  >
                    Details View
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
