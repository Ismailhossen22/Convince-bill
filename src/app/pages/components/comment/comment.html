<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-300 bg-opacity-60">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
      <h3 class="text-lg font-semibold text-gray-800">Reject Bill Details</h3>
      <span class="text-sm font-medium text-gray-500">1/3</span>
    </div>

    <div class="p-6">
      <div class="overflow-x-auto border rounded-md mb-4">
        <table class="w-full text-sm text-left border-collapse">
          <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
            <tr>
              <th class="border border-gray-300 px-3 py-2">SL</th>
              <th class="border px-3 py-2 text-nowrap border-gray-300">Visited Date</th>
              <th class="border px-3 py-2 border-gray-300">From</th>
              <th class="border px-3 py-2">To</th>
              <th class="border px-3 py-2">Purpose</th>
              <th class="border px-3 py-2">Amount</th>
            </tr>
          </thead>
          <tbody>
            @for (item of selectedBills(); track item.convID; let i = $index) {
              <tr>
                <td class="border px-3 py-2">{{ i + 1 }}</td>
                <td class="border px-3 py-2">{{ item.visitedDate | date: 'd-MMM' }}</td>
                <td class="border px-3 py-2">{{ item.fromLocation }}</td>
                <td class="border px-3 py-2">{{ item.toLocation }}</td>
                <td class="border px-3 py-2">{{ item.purpose }}</td>
                <td class="border px-3 py-2 font-semibold">{{ item.amount }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Write Comment/Reason:</label>
        <textarea
          [ngModel]="rejectReason()"
          (ngModelChange)="rejectReason.set($event)"
          class="w-full h-32 px-3 py-2 text-gray-700 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-500 focus:border-gray-500"
          placeholder="Enter the reason for rejection..."
        >
        </textarea>
      </div>
    </div>

    <div class="px-6 py-4 bg-gray-50 border-t flex justify-end space-x-3">
      <button
        (click)="onCancel()"
        class="px-5 py-2 text-sm font-medium text-white bg-blue-400 rounded-md hover:bg-blue-500 transition duration-200"
      >
        Cancel
      </button>
      <button
        (click)="onSubmit()"
        class="px-5 py-2 text-sm font-medium text-white bg-emerald-400 rounded-md hover:bg-emerald-500 transition duration-200"
      >
        Submit
      </button>
    </div>
  </div>
</div>
